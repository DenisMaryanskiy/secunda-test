[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os

# sqlalchemy.url задаётся в alembic/env.py из настроек приложения,
# чтобы адрес БД не жил в двух местах сразу.

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
