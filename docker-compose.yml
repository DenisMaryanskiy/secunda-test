name: secunda-payments

# Значения по умолчанию подобраны так, чтобы `docker compose up` работал без .env.
x-app-env: &app-env
  ENVIRONMENT: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  API_KEY: ${API_KEY:-local-dev-key}
  DATABASE__URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
  BROKER__URL: amqp://guest:guest@rabbitmq:5672/
  WEBHOOK__SIGNING_SECRET: ${WEBHOOK__SIGNING_SECRET:-local-dev-webhook-secret}
  # Внутри compose webhook уходит на соседний контейнер по http и приватному адресу,
  # поэтому SSRF-guard здесь ослаблен. В production такой конфиг не поднимется.
  WEBHOOK__ALLOW_INSECURE_TARGETS: "true"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Миграции отдельным одноразовым сервисом: приложение не накатывает схему на старте,
  # иначе три реплики API начнут делать это наперегонки.
  migrator:
    build: .
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command:
      - uvicorn
      - payment_service.api.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      # Свой dictConfig уже настроен в configure_logging, иначе uvicorn перебьёт его своим.
      - --no-access-log
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as r; r.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Приёмник вебхуков для локального демо: печатает в лог заголовки и тело,
  # так что видно и подпись X-Payment-Signature. В проде его, разумеется, нет.
  webhook-sink:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: "8080"
    ports:
      - "${WEBHOOK_SINK_PORT:-8080}:8080"

  consumer:
    build: .
    command: python -m payment_service.messaging.consumer
    environment: *app-env
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build: .
    command: python -m payment_service.outbox
    environment: *app-env
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
