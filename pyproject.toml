[project]
name = "payment-service"
version = "0.1.0"
description = "Асинхронный сервис процессинга платежей"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "faststream[rabbit]>=0.7.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "A",      # builtins shadowing
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "T20",    # print
    "SIM",    # simplify
    "TID",    # tidy imports
    "PTH",    # pathlib
    "RUF",
    "S",      # bandit
    "ASYNC",
]
ignore = [
    "B008",              # Depends() в аргументах по умолчанию - идиома FastAPI
    "RUF001",            # комментарии и docstring'и на русском, кириллица
    "RUF002",            # в них не "ambiguous unicode", а нормальный текст
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
files = ["src/payment_service", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=payment_service --cov-report=term-missing"
markers = [
    "integration: требует Docker (Postgres + RabbitMQ через testcontainers)",
]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

omit = [
    # Точка входа: только собирает объекты и запускает цикл. Проверяется тем,
    # что стек поднимается в docker compose, а сам relay покрыт тестами.
    "*/outbox/__main__.py",
]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
]
